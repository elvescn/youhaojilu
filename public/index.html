<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<title>油耗账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录（浮层：数据公开浏览，仅增删改/备份需要登录） -->
<div id="login-view" class="login-wrap" hidden>
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5c3.6 4.2 6 7.4 6 10.4a6 6 0 0 1-12 0c0-3 2.4-6.2 6-10.4z"/>
        <path d="M9.5 14.5a2.8 2.8 0 0 0 2.5 2.8"/>
      </svg>
    </div>
    <h1>油耗账本</h1>
    <p class="muted">数据存在自己的 Cloudflare D1，每次记录自动备份到邮箱</p>
    <input id="login-token" type="password" placeholder="请输入访问口令" autocomplete="current-password">
    <button id="login-btn" class="btn primary full">登 录</button>
    <button id="login-cancel" class="btn ghost full" style="margin-top:8px">暂不登录，随便看看</button>
    <p id="login-msg" class="error"></p>
  </div>
</div>

<!-- 主界面（公开可见；登录后解锁增删改与备份） -->
<div id="app-view">
  <header class="topbar">
    <div class="topbar-title">油耗账本</div>
    <div class="topbar-actions">
      <button id="btn-login" class="btn ghost">登录</button>
      <button id="btn-backup" class="btn ghost" title="立即发送全量备份邮件" hidden>备份</button>
      <button id="btn-logout" class="btn ghost" title="退出登录" hidden>退出</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dash">仪表盘</button>
    <button class="tab" data-tab="fuel">加油记录</button>
    <button class="tab" data-tab="data">数据</button>
  </nav>

  <main>
    <!-- 仪表盘 -->
    <section id="tab-dash" class="tabpane active">
      <div class="cards" id="dash-cards"></div>
      <div class="range-bar">
        <span class="range-label">时间范围</span>
        <select id="dash-range">
          <option value="1y" selected>近 1 年</option>
          <option value="3y">近 3 年</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="panel">
        <h3>月度油耗（L/100km）</h3>
        <canvas id="chart-consumption" height="180"></canvas>
        <div id="tip-consumption" class="chart-tip" hidden></div>
      </div>
      <div class="panel">
        <h3>月度油费（元）</h3>
        <canvas id="chart-cost" height="180"></canvas>
        <div id="tip-cost" class="chart-tip" hidden></div>
      </div>
    </section>

    <!-- 加油记录 -->
    <section id="tab-fuel" class="tabpane">
      <div class="toolbar">
        <select id="fuel-year"></select>
        <select id="fuel-grade">
          <option value="">全部油号</option>
        </select>
        <input id="fuel-q" type="search" placeholder="搜加油站/备注">
        <button id="fuel-add" class="btn primary">＋ 记一笔</button>
      </div>
      <div class="table-wrap">
        <table class="grid" id="fuel-table">
          <thead><tr>
            <th>日期</th><th>里程</th><th>加油</th><th>单价</th><th>实付</th><th>油耗</th><th>油号</th><th>备注</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn ghost" id="fuel-prev">上一页</button>
        <span id="fuel-pageinfo" class="muted"></span>
        <button class="btn ghost" id="fuel-next">下一页</button>
      </div>
    </section>

    <!-- 费用记录 tab 已移除，仅保留加油记录 -->

    <!-- 数据 -->
    <section id="tab-data" class="tabpane">
      <div class="panel">
        <h3>导出</h3>
        <p class="muted">CSV 表头与小熊油耗导出一致，可直接用 Excel 打开；JSON 为全量快照，可用于整库迁移。</p>
        <div class="btn-row">
          <a class="btn" href="/api/export?format=csv&amp;type=fuel" download>导出油耗 CSV</a>
          <a class="btn" href="/api/export?format=json" download>导出全量 JSON</a>
        </div>
      </div>
      <div class="panel">
        <h3>导入</h3>
        <p class="muted">支持本系统导出的 JSON 全量快照（含 fuel_records / expense_records 键名）。导入后油耗按加满链自动重算。单次上限 5000 条。</p>
        <div class="btn-row">
          <input type="file" id="import-file" accept=".json,.csv,application/json">
        </div>
        <textarea id="import-text" rows="5" placeholder="或直接粘贴 JSON 内容"></textarea>
        <div class="btn-row">
          <button id="import-btn" class="btn primary">开始导入</button>
          <span id="import-msg" class="muted"></span>
        </div>
      </div>
      <div class="panel">
        <h3>发信记录</h3>
        <div class="table-wrap">
          <table class="grid" id="mail-table">
            <thead><tr><th>时间</th><th>类型</th><th>主题</th><th>结果</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- 悬浮记账按钮（手机端右下角） -->
  <button id="fab-add" class="fab" title="记一笔" aria-label="新增加油记录">＋</button>
</div>

<!-- 编辑弹窗 -->
<div id="modal" class="modal-mask" hidden>
  <div class="modal">
    <h3 id="modal-title">记一笔</h3>
    <form id="record-form">
      <input type="hidden" id="f-id">
      <input type="hidden" id="f-kind" value="fuel">
      <div class="form-grid">
        <label>日期时间<input type="datetime-local" id="f-datetime" required></label>
        <label id="lbl-vehicle" style="display:none">车辆<input type="text" id="f-vehicle" disabled></label>
      </div>
      <div class="form-grid" id="fuel-fields">
        <label>总里程 km<input type="number" id="f-odometer" step="0.1" min="0" required></label>
        <label>油号<select id="f-grade"></select></label>
        <label>机显单价 元/L<input type="number" id="f-price" step="0.01" min="0"></label>
        <label>加油量 L<input type="number" id="f-liters" step="0.01" min="0" required></label>
        <label>机显金额 元<input type="number" id="f-amount-display" step="0.01" min="0"></label>
        <label>实付金额 元<input type="number" id="f-amount-paid" step="0.01" min="0"></label>
        <label>加油站<input type="text" id="f-station" maxlength="100" placeholder="可空，输入或从历史选择" list="station-list" autocomplete="off"><datalist id="station-list"></datalist></label>
      </div>
      <div class="checks" id="fuel-checks">
        <label><input type="checkbox" id="f-full" checked> 加满</label>
        <label><input type="checkbox" id="f-light"> 亮灯加油</label>
        <label><input type="checkbox" id="f-missed"> 漏记</label>
      </div>
      <label id="lbl-note">备注<textarea id="f-note" rows="2" maxlength="2000" placeholder="可空"></textarea></label>
      <p id="form-msg" class="error"></p>
      <div class="btn-row right">
        <button type="button" class="btn ghost" id="modal-cancel">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
